<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f7f5"/>
      <stop offset="100%" stop-color="#eceae5"/>
    </linearGradient>
    <linearGradient id="strokeWat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a8377"/>
      <stop offset="100%" stop-color="#645d52"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="1000" fill="url(#bgWat)"/>
  <rect x="24" y="24" width="752" height="952" rx="4" fill="none" stroke="#e0ded8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  
  <g transform="translate(400, 480)" text-anchor="middle">
    <circle cx="0" cy="0" r="110" fill="#ffffff" opacity="0.85"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#e3dfd7" stroke-width="1.5"/>

    <!-- Apple Watch Minimal Outline -->
    <g stroke="url(#strokeWat)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Top Strap -->
      <path d="M-28,-50 L-22,-80 L22,-80 L28,-50" opacity="0.5"/>
      <!-- Bottom Strap -->
      <path d="M-28,50 L-22,80 L22,80 L28,50" opacity="0.5"/>
      <!-- Watch Chassis Case -->
      <rect x="-44" y="-50" width="88" height="100" rx="22"/>
      <!-- Watch Display -->
      <rect x="-36" y="-42" width="72" height="84" rx="15" opacity="0.35"/>
      <!-- Digital Crown -->
      <rect x="44" y="-28" width="6" height="20" rx="2" fill="url(#strokeWat)"/>
      <!-- Side Button -->
      <rect x="44" y="4" width="4" height="24" rx="2" fill="url(#strokeWat)" opacity="0.5"/>
      <!-- Clock Hands Indicator -->
      <circle cx="0" cy="0" r="3" fill="url(#strokeWat)"/>
      <line x1="0" y1="0" x2="0" y2="-18" stroke-width="2"/>
      <line x1="0" y1="0" x2="12" y2="6" stroke-width="2"/>
    </g>
    
    <text y="170" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#7a7368" text-transform="uppercase">APPLE WATCH CARE</text>
    <text y="196" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" letter-spacing="2" fill="#a49e94" text-transform="uppercase">OLED GLASS & BATTERY RENEWAL</text>
  </g>

  <text x="400" y="930" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#b5b0a6">iFix • APPLE WATCH</text>
</svg>
