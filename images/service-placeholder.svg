<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f7f5"/>
      <stop offset="100%" stop-color="#eceae5"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#968e82"/>
      <stop offset="100%" stop-color="#726a5f"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  
  <!-- Subtle Framing -->
  <rect x="24" y="24" width="752" height="952" rx="4" fill="none" stroke="#e0ded8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  
  <!-- Center Aesthetic Graphic -->
  <g transform="translate(400, 480)" text-anchor="middle">
    <!-- Circular Soft Glow Disc -->
    <circle cx="0" cy="0" r="110" fill="#ffffff" opacity="0.8" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#e3dfd7" stroke-width="1.5"/>

    <!-- Aesthetic Minimal Device / Hardware Silhouette -->
    <g stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Minimalist Precision Chip / Shield Icon -->
      <rect x="-42" y="-42" width="84" height="84" rx="14"/>
      <!-- Inner Circuit / Core -->
      <circle cx="0" cy="0" r="16" fill="url(#iconGrad)" opacity="0.15"/>
      <circle cx="0" cy="0" r="16"/>
      <!-- Connection Pins -->
      <line x1="-24" y1="-42" x2="-24" y2="-52"/>
      <line x1="0" y1="-42" x2="0" y2="-52"/>
      <line x1="24" y1="-42" x2="24" y2="-52"/>
      <line x1="-24" y1="42" x2="-24" y2="52"/>
      <line x1="0" y1="42" x2="0" y2="52"/>
      <line x1="24" y1="42" x2="24" y2="52"/>
      <line x1="-42" y1="-24" x2="-52" y2="-24"/>
      <line x1="-42" y1="0" x2="-52" y2="0"/>
      <line x1="-42" y1="24" x2="-52" y2="24"/>
      <line x1="42" y1="-24" x2="52" y2="-24"/>
      <line x1="42" y1="0" x2="52" y2="0"/>
      <line x1="42" y1="24" x2="52" y2="24"/>
    </g>
    
    <!-- Minimal Aesthetic Label -->
    <text y="170" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#7a7368" text-transform="uppercase">CERTIFIED HARDWARE</text>
    <text y="196" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" letter-spacing="2" fill="#a49e94" text-transform="uppercase">GENUINE OEM SPECIFICATION</text>
  </g>

  <!-- Watermark Branding -->
  <text x="400" y="930" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#b5b0a6">iFix • PRECISION CARE</text>
</svg>
