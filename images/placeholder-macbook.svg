<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f7f5"/>
      <stop offset="100%" stop-color="#eceae5"/>
    </linearGradient>
    <linearGradient id="strokeMb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a8377"/>
      <stop offset="100%" stop-color="#645d52"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="1000" fill="url(#bgMb)"/>
  <rect x="24" y="24" width="752" height="952" rx="4" fill="none" stroke="#e0ded8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  
  <g transform="translate(400, 480)" text-anchor="middle">
    <circle cx="0" cy="0" r="110" fill="#ffffff" opacity="0.85"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#e3dfd7" stroke-width="1.5"/>

    <!-- MacBook Minimal Outline -->
    <g stroke="url(#strokeMb)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Screen Lid -->
      <rect x="-65" y="-55" width="130" height="85" rx="8"/>
      <!-- Inner Display -->
      <rect x="-57" y="-47" width="114" height="69" rx="3" opacity="0.4"/>
      <!-- Apple Logo Placeholder Pip -->
      <circle cx="0" cy="-12" r="6" fill="url(#strokeMb)" opacity="0.4"/>
      <!-- Base Chassis -->
      <path d="M-85,35 L85,35 C88,35 90,38 88,41 L82,47 C80,49 76,50 72,50 L-72,50 C-76,50 -80,49 -82,47 L-88,41 C-90,38 -88,35 -85,35 Z"/>
      <!-- Trackpad notch -->
      <line x1="-16" y1="35" x2="16" y2="35" stroke="#ffffff" stroke-width="3"/>
    </g>
    
    <text y="170" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#7a7368" text-transform="uppercase">MACBOOK SERVICES</text>
    <text y="196" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" letter-spacing="2" fill="#a49e94" text-transform="uppercase">GENUINE APPLE OEM PARTS</text>
  </g>

  <text x="400" y="930" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#b5b0a6">iFix • MACBOOK CARE</text>
</svg>
