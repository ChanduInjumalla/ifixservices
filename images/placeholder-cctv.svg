<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f7f5"/>
      <stop offset="100%" stop-color="#eceae5"/>
    </linearGradient>
    <linearGradient id="strokeCam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a8377"/>
      <stop offset="100%" stop-color="#645d52"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="1000" fill="url(#bgCam)"/>
  <rect x="24" y="24" width="752" height="952" rx="4" fill="none" stroke="#e0ded8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  
  <g transform="translate(400, 480)" text-anchor="middle">
    <circle cx="0" cy="0" r="110" fill="#ffffff" opacity="0.85"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#e3dfd7" stroke-width="1.5"/>

    <!-- CCTV Dome Minimal Outline -->
    <g stroke="url(#strokeCam)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Ceiling Mount Base -->
      <path d="M-60,-35 L60,-35 C64,-35 66,-32 64,-28 L56,-15 L-56,-15 L-64,-28 C-66,-32 -64,-35 -60,-35 Z"/>
      <!-- Dome Glass Hemishpere -->
      <path d="M-48,-15 C-48,32 48,32 48,-15"/>
      <!-- Camera Lens Orb Inside Dome -->
      <circle cx="0" cy="8" r="22" fill="#ffffff" stroke="url(#strokeCam)" stroke-width="2.5"/>
      <circle cx="0" cy="8" r="12" fill="url(#strokeCam)" opacity="0.4"/>
      <circle cx="0" cy="8" r="5" fill="url(#strokeCam)"/>
      <circle cx="-5" cy="4" r="2" fill="#ffffff"/>
    </g>
    
    <text y="170" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#7a7368" text-transform="uppercase">CCTV CAMERA SERVICES</text>
    <text y="196" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" letter-spacing="2" fill="#a49e94" text-transform="uppercase">4K SURVEILLANCE & SECURITY</text>
  </g>

  <text x="400" y="930" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#b5b0a6">iFix • CCTV SECURITY</text>
</svg>
