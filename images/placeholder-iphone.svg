<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f7f5"/>
      <stop offset="100%" stop-color="#eceae5"/>
    </linearGradient>
    <linearGradient id="strokeIp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a8377"/>
      <stop offset="100%" stop-color="#645d52"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="1000" fill="url(#bgIp)"/>
  <rect x="24" y="24" width="752" height="952" rx="4" fill="none" stroke="#e0ded8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  
  <g transform="translate(400, 480)" text-anchor="middle">
    <circle cx="0" cy="0" r="110" fill="#ffffff" opacity="0.85"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#e3dfd7" stroke-width="1.5"/>

    <!-- iPhone Minimal Outline -->
    <g stroke="url(#strokeIp)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Body -->
      <rect x="-42" y="-70" width="84" height="140" rx="18"/>
      <!-- Screen boundary -->
      <rect x="-36" y="-64" width="72" height="128" rx="14" opacity="0.35"/>
      <!-- Dynamic Island -->
      <rect x="-14" y="-56" width="28" height="8" rx="4" fill="url(#strokeIp)"/>
      <!-- Home bar indicator -->
      <line x1="-16" y1="52" x2="16" y2="52" stroke-width="2"/>
    </g>
    
    <text y="170" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#7a7368" text-transform="uppercase">IPHONE SERVICES</text>
    <text y="196" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" letter-spacing="2" fill="#a49e94" text-transform="uppercase">GENUINE OLED & BATTERY</text>
  </g>

  <text x="400" y="930" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#b5b0a6">iFix • IPHONE CARE</text>
</svg>
